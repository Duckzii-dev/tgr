services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: gym_progress
      MYSQL_USER: gym
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gympass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pgympass", "-ugym"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://gym:${MYSQL_PASSWORD:-gympass}@db:3306/gym_progress"
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET required}"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:5173}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      SEED_EMAIL: "${SEED_EMAIL:-}"
      SEED_PASSWORD: "${SEED_PASSWORD:-}"
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && node src/index.js"

  client:
    build:
      context: ./client
      args:
        VITE_TURNSTILE_SITE_KEY: "${VITE_TURNSTILE_SITE_KEY:-}"
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  db_data: